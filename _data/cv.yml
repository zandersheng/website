    Working Papers:
      - title: Infrequent Trading, Asymmetrical Asset Price Volatility, and Welfare Loss (JMP)
        authors:
          - Xuran Alex Sheng
        releaseDate: 2026
        url: ""
        summary: As an increasing amount of assets are subject to infrequent trading restrictions or horizon-bound illiquidity through real estate holdings, private equity lockups, household infrequent adjustment, and institutional vesting requirements. We develop a finite-horizon, continuous-time heterogeneous agent model to analyze how these explicit trading restrictions affect the risk sharing behaviors and asset prices. By modeling an economy populated by a restricted investor and a liquid market maker, we identify an endogenous liquidity squeeze. To self insure against the inability to dynamically rebalance, the restricted agent optimally holds excess equity at time 0, starving the market maker of capital and forcing them into suboptimal positions. This economic friction structurally generates excess price volatility and jump risks, resulting in block trades and yield curve jumps at the moment liquidity is restored. We map the welfare cost to demonstrate that welfare losses rely asymmetrically on the capitalization of the liquid agents rather than restriction duration. Finally, by decomposing the ex-ante welfare cost of illiquidity, I find that the danger of illiquidity is not the only inability to trade, but the endogenous price distortions it creates, resulting in an aggregate welfare loss that outweighs the classic cost of fundamental business cycles.
        
      - title: Optimal Renovation and Lease Renewal in a Principal – Agent Framework
        authors:
          - Xuran Alex Sheng
        releaseDate: 2026
        url: ""
        summary: ""
        
      - title: "Rogue Agent: The Economics of Compute in Agentic Age"
        authors:
          - Xuran Alex Sheng
        releaseDate: 2026
        url: ""
        summary: This paper develops a task-based model in which heterogeneous software tasks are allocated across human, reasoning-assisted, and agentic workflows. The model shows that when agentic compute costs grow faster than labor savings, agentic coding is eventually excluded for sufficiently complex tasks. Under additional restrictions, optimal agentic usage is concentrated within an intermediate or low complexity region. Initial compute capacity shifts tasks from unaided human production to reasoning-assisted workflows, while additional capacity  expands agentic coding. Even when the compute constraint ceases to bind, reasoning remains optimal for a subset of tasks. The results highlight task composition and internal compute governance as central determinants of organizational AI adoption.
